name: Pages

# Publishes the web app in mock mode (no backend, no credits) to GitHub Pages.
# GitHub's free plan serves Pages only from public repos, so the job skips while the repo
# is private. After the repo goes public: Settings -> Pages -> Source: GitHub Actions, then
# re-run this workflow (or push to main).

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # --base: Pages serves the app under /<repo>/, not at the root.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          NODE_ENV: production
          VITE_API_MODE: mock
      # Pages has no SPA rewrites: serve the app for deep links like /akshara/teacher.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
