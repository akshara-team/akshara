[project]
name = "akshara"
version = "0.1.0"
description = "Reading-fluency tutor for children in Kannada, Tamil and Hindi, built on Gnani AI models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.152.0",
    "httpx>=0.27",
    "numpy>=2.4.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akshara"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/akshara/api/app.py" = ["B008"]  # FastAPI's File()/Form() defaults
