<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshara reading screen</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a64; --card:#fff; --line:#e4e1d8;
          --ok:#1b7f3b; --okbg:#e3f4e8; --bad:#b3261e; --badbg:#fde7e5; --warn:#8a5a00; --warnbg:#fff1d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141412; --fg:#f1efe8; --muted:#a7a59c; --card:#1e1e1b; --line:#34332e;
            --ok:#7bd48f; --okbg:#173a22; --bad:#ff9a92; --badbg:#431d1a; --warn:#f2c26b; --warnbg:#3d2f10; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 2px; }
  p.sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  select, input[type=text], input[type=file] { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } }
  button { padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--fg); color:var(--bg); font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #text { font-size:1.6rem; line-height:2.2; }
  .w { display:inline-block; padding:0 8px; margin:2px 3px; border-radius:8px; border:2px solid transparent; }
  .w.correct { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
  .w.substituted, .w.skipped { background:var(--badbg); color:var(--bad); border-color:var(--bad); }
  .w.skipped { text-decoration:line-through; }
  .w.uncertain { background:var(--warnbg); color:var(--warn); border-color:var(--warn); border-style:dashed; }
  .legend span { margin-right:14px; font-size:.85rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .muted { color:var(--muted); }
  .stats { display:flex; gap:24px; margin:8px 0; flex-wrap:wrap; }
  .stats b { font-size:1.4rem; display:block; }
  #status { min-height:1.5em; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Akshara</h1>
  <p class="sub">Read the sentence aloud. Words you read correctly turn green; skipped or different words turn red.</p>

  <section class="card">
    <div class="row">
      <div><label for="lang">Language</label>
        <select id="lang"><option value="hi-IN">Hindi</option><option value="kn-IN">Kannada</option><option value="ta-IN">Tamil</option></select></div>
      <div><label for="passage">Passage</label><select id="passage"></select></div>
    </div>
    <div style="margin-top:12px"><label for="learner">Learner alias (no real names)</label>
      <input type="text" id="learner" value="learner-1" maxlength="40"></div>
  </section>

  <section class="card">
    <div id="text" aria-live="polite"></div>
    <div class="legend muted">
      <span>✓ read correctly</span><span>✗ skipped or different</span><span>? check this word</span>
    </div>
  </section>

  <section class="card">
    <button id="rec">Start recording</button>
    <span class="muted" style="margin:0 8px">or</span>
    <input type="file" id="file" accept="audio/wav,.wav" style="width:auto">
    <div id="status" class="muted"></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="stats"><div><b id="acc">-</b>accuracy</div><div><b id="wcpm">-</b>words per minute</div></div>
    <div class="muted">What the system heard:</div>
    <p id="heard" style="margin-top:4px"></p>
    <table><thead><tr><th>Word</th><th>Heard</th><th>Result</th></tr></thead><tbody id="trace"></tbody></table>
  </section>

  <section class="card">
    <strong>Class summary</strong>
    <table><thead><tr><th>Learner</th><th>Attempts</th><th>Accuracy</th><th>WCPM</th></tr></thead><tbody id="class"></tbody></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const MARK = { correct: "✓", substituted: "✗", skipped: "✗", uncertain: "?" };
let passages = [], recorder = null, chunks = [];

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function setStatus(msg, bad) { $("status").textContent = msg; $("status").className = bad ? "err" : "muted"; }

async function loadPassages() {
  const r = await fetch(`/v1/passages?lang=${$("lang").value}`);
  passages = await r.json();
  $("passage").innerHTML = passages.map((p) => `<option value="${esc(p.id)}">${esc(p.text.slice(0, 40))}…</option>`).join("");
  showText();
}
function current() { return passages.find((p) => p.id === $("passage").value); }
function showText() {
  const p = current();
  $("text").innerHTML = p ? p.text.split(/\s+/).map((w) => `<span class="w">${esc(w)}</span>`).join(" ") : "";
  $("result").hidden = true;
}

function show(a) {
  const refs = a.words.filter((w) => w.op !== "inserted");
  $("text").innerHTML = refs.map((w) => `<span class="w ${w.op}" title="${esc(w.op)}">${MARK[w.op] || ""} ${esc(w.word)}</span>`).join(" ");
  $("acc").textContent = Math.round(a.accuracy * 100) + "%";
  $("wcpm").textContent = a.wcpm == null ? "-" : Math.round(a.wcpm);
  $("heard").textContent = a.transcript;
  $("trace").innerHTML = a.words.map((w) =>
    `<tr><td>${esc(w.word ?? "")}</td><td>${esc(w.said ?? "")}</td><td>${w.op === "inserted" ? "extra word" : esc(w.op)}</td></tr>`).join("");
  $("result").hidden = false;
}

async function loadClass() {
  const rows = await (await fetch("/v1/class/summary")).json();
  $("class").innerHTML = rows.map((r) =>
    `<tr><td>${esc(r.alias)}</td><td>${r.attempts}</td><td>${Math.round(r.accuracy * 100)}%</td><td>${r.wcpm == null ? "-" : Math.round(r.wcpm)}</td></tr>`).join("")
    || `<tr><td colspan="4" class="muted">No attempts yet</td></tr>`;
}

async function toWav16k(blob) {
  const ctx = new AudioContext();
  const audio = await ctx.decodeAudioData(await blob.arrayBuffer());
  const off = new OfflineAudioContext(1, Math.ceil(audio.duration * 16000), 16000);
  const src = off.createBufferSource();
  src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVEfmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  str(36, "data"); out.setUint32(40, pcm.length * 2, true);
  pcm.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));
  return new Blob([out], { type: "audio/wav" });
}

async function send(wav) {
  const p = current();
  const form = new FormData();
  form.append("audio", wav, `${p.id}.wav`);
  form.append("learner", $("learner").value || "learner-1");
  form.append("passage_id", p.id);
  setStatus("Checking…");
  const r = await fetch("/v1/attempts", { method: "POST", body: form, headers: { "X-Request-ID": crypto.randomUUID() } });
  if (!r.ok) { setStatus(`Could not check this reading (${r.status}). Try again.`, true); return; }
  setStatus("");
  show(await r.json());
  loadClass();
}

$("rec").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      recorder = null; $("rec").textContent = "Start recording";
      try { await send(await toWav16k(new Blob(chunks))); } catch (e) { setStatus("Could not read the recording.", true); }
    };
    recorder.start(); $("rec").textContent = "Stop and check"; setStatus("Recording… read the sentence aloud.");
  } catch (e) { setStatus("Microphone not available. You can upload a WAV file instead.", true); }
};
$("file").onchange = async (e) => { if (e.target.files[0]) await send(e.target.files[0]); e.target.value = ""; };
$("lang").onchange = loadPassages;
$("passage").onchange = showText;
loadPassages(); loadClass();
</script>
</body>
</html>
